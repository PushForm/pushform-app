name: Prepare STEP and DWG modules
description: Restore matching compiled reader modules or build them for WebAssembly
runs:
  using: composite
  steps:
    # Pinned: the STEP reader's threaded build does not link on Rust 1.100 (`__wasi_init_tp` is undefined there).
    - uses: dtolnay/rust-toolchain@master
      with: { toolchain: '1.99.1', targets: 'wasm32-wasip1, wasm32-wasip1-threads' }
    - id: rust-version
      shell: bash
      run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: step-wasm
      with:
        path: packages/io/wasm/*.wasm
        key: step-wasm-v1-${{ runner.os }}-${{ steps.rust-version.outputs.hash }}-${{ hashFiles('crates/**', '!crates/**/target/**', '.cargo/**', 'rust-toolchain*', 'scripts/build-step-reader.mjs', 'scripts/build-dwg-reader.mjs') }}
    - uses: Swatinem/rust-cache@v2
      if: steps.step-wasm.outputs.cache-hit != 'true'
      with: { workspaces: "crates/step-reader\ncrates/dwg-reader" }
    - shell: bash
      if: steps.step-wasm.outputs.cache-hit != 'true'
      run: node scripts/build-step-reader.mjs && node scripts/build-dwg-reader.mjs
    - shell: bash
      run: node scripts/build-step-reader.mjs --check && node scripts/build-dwg-reader.mjs --check
