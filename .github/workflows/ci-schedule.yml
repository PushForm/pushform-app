name: ci-schedule
on:
  # Manual runs let you check the scheduler itself without waiting for GitHub's cron.
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour, when GitHub's scheduler is busiest.
    - cron: '7,22,37,52 * * * *'

concurrency:
  group: ci-schedule-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/github-script@v7
        with:
          script: |
            const { scheduleMainCi } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-schedule.mjs`);
            core.info(await scheduleMainCi(github, context.repo));
