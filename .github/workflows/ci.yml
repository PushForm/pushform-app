name: ci
on:
  push:
    branches: [staging]
  # main is dispatched by ci-schedule.yml in 15-minute batches; manual runs can bypass the wait.
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all checks and deploy both sites regardless of changed paths
        type: boolean
        default: false
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.scope.outputs.plan }}
      checks: ${{ steps.scope.outputs.checks }}
      web: ${{ steps.scope.outputs.web }}
      commons: ${{ steps.scope.outputs.commons }}
      wasm: ${{ steps.scope.outputs.wasm }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/github-script@v7
        id: baseline
        with:
          result-encoding: string
          script: |
            if (context.payload.pull_request) return context.payload.pull_request.base.sha;
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo,
                workflow_id: 'ci.yml', branch: context.ref.replace('refs/heads/', ''), status: 'success', per_page: 100 });
              return data.workflow_runs.find(run => run.event !== 'pull_request' && run.id !== context.runId)?.head_sha ?? '';
            } catch (error) { core.warning(`Full validation: ${error.message}`); return ''; }
      - id: scope
        run: node scripts/ci-plan.mjs plan
        env:
          CI_BASE: ${{ steps.baseline.outputs.result }}
          CI_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          CI_FULL: ${{ inputs.full_validation == true }}

  step-reader:
    needs: plan
    if: needs.plan.outputs.wasm == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: ./.github/actions/step-reader
      - uses: actions/upload-artifact@v7
        with:
          name: step-reader-wasm
          path: packages/io/wasm/*.wasm
          if-no-files-found: error
          retention-days: 1
  # The kernel's WebAssembly module, which the test suite, the web build and the deploy all need. Published modules are
  # downloaded by source hash; a change to the kernel (a pull request, a fork) builds its own for this run.
  kernel-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: ./.github/actions/kernel-wasm
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-wasm
          path: |
            packages/kernel/wasm/*.wasm
            packages/kernel/wasm/pushform-kernel*.js
            packages/kernel/wasm/kernel-wasm.stamp.json
          if-no-files-found: error
          retention-days: 1

  # Publishes the module on main when no release exists for these sources yet. The only job with write access, and it
  # runs no build steps of its own. Pinning the checksums afterwards is a commit (`pnpm kernel-wasm:pin`), not CI's to make.
  publish-kernel-wasm:
    needs: kernel-wasm
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'PushForm/pushform-app' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/download-artifact@v8
        with: { name: kernel-wasm, path: packages/kernel/wasm }
      - run: node scripts/publish-kernel-wasm.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  typecheck:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/ci-plan.mjs typecheck
        env: { CI_PLAN: '${{ needs.plan.outputs.plan }}' }

  lint:
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: node scripts/ci-plan.mjs lint
        env: { CI_PLAN: '${{ needs.plan.outputs.plan }}' }

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm license-check
      - run: pnpm spdx-check

  unit:
    needs: [plan, step-reader, kernel-wasm]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.checks == 'true' && (needs.step-reader.result == 'success' || needs.step-reader.result == 'skipped') && needs.kernel-wasm.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.wasm == 'true'
        with: { name: step-reader-wasm, path: packages/io/wasm }
      - uses: actions/download-artifact@v8
        with: { name: kernel-wasm, path: packages/kernel/wasm }
      - run: node scripts/ci-plan.mjs test
        env: { CI_PLAN: '${{ needs.plan.outputs.plan }}' }

  build-web:
    needs: [plan, step-reader, kernel-wasm]
    if: ${{ !cancelled() && needs.plan.outputs.web == 'true' && needs.step-reader.result == 'success' && needs.kernel-wasm.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with: { name: step-reader-wasm, path: packages/io/wasm }
      - uses: actions/download-artifact@v8
        with: { name: kernel-wasm, path: packages/kernel/wasm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  build-commons:
    needs: plan
    if: needs.plan.outputs.commons == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm commons:build

  # Keep one required status while independent checks run concurrently.
  test:
    needs: [plan, step-reader, kernel-wasm, typecheck, lint, policy, unit, build-web, build-commons]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - env: { RESULTS: '${{ toJSON(needs) }}' }
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'

  deploy-commons:
    # Without always(), a skipped upstream job (step-reader, when only Commons changed) skips this deploy too.
    if: ${{ always() && needs.test.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.plan.outputs.commons == 'true' }}
    needs: [test, plan]
    runs-on: ubuntu-24.04
    environment: Production
    concurrency: { group: deploy-commons-production, cancel-in-progress: false }
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_COMMONS_ASSETS_URL: ${{ vars.VITE_COMMONS_ASSETS_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the configured Commons site
        run: |
          node scripts/check-cloud-config.mjs
          pnpm commons:build
          node scripts/check-cloud-config.mjs apps/commons/dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Run from the app directory so Pages also bundles its functions/ (page tags, sitemap, robots.txt).
          workingDirectory: apps/commons
          command: pages deploy dist --project-name pushform-commons --branch main --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Verify Commons serves this build
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-static-deploy.mjs https://commons.pushform.io apps/commons/dist; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          exit 1
      - name: Verify Commons serves search tags, a sitemap and robots.txt
        shell: bash
        run: |
          # Download to files first: grep -q exits at the first match and would make curl fail on the large sitemap.
          check() {
            local dir; dir="$(mktemp -d)"
            curl -fsS -o "$dir/robots" https://commons.pushform.io/robots.txt &&
            curl -fsS -o "$dir/sitemap" https://commons.pushform.io/sitemap.xml &&
            curl -fsS -o "$dir/home" https://commons.pushform.io/ &&
            grep -q "^Sitemap: https://commons.pushform.io/sitemap.xml" "$dir/robots" &&
            grep -q "<urlset" "$dir/sitemap" &&
            grep -q "rel=\"canonical\"" "$dir/home"
          }
          for attempt in 1 2 3 4 5 6; do
            if check; then exit 0; fi
            if [[ "$attempt" -lt 6 ]]; then sleep 10; fi
          done
          exit 1

  # Deploy checked main batches and staging pushes to Cloudflare Pages. Needs the environment
  # secrets CLOUDFLARE_API_TOKEN (Workers & Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
  deploy:
    # always() so a skipped job upstream of test (such as the Commons build) does not skip the deploy;
    # test itself fails when any check failed.
    if: ${{ always() && needs.test.result == 'success' && needs.plan.outputs.web == 'true' && needs.kernel-wasm.result == 'success' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging')) }}
    needs: [test, plan, kernel-wasm]
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'staging' && 'Staging' || 'Production' }}
      url: ${{ github.ref_name == 'staging' && 'https://staging.pushform-app.pages.dev' || 'https://pushform-app.pages.dev' }}
    concurrency: { group: 'deploy-${{ github.ref_name == ''staging'' && ''staging'' || ''production'' }}', cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
        # The whole history: About PushForm's version counts this week's commits.
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The web bundle includes the STEP reader the test job built.
      - uses: actions/download-artifact@v8
        with: { name: step-reader-wasm, path: packages/io/wasm }
      # The kernel module the kernel-wasm job fetched or built.
      - uses: actions/download-artifact@v8
        with: { name: kernel-wasm, path: packages/kernel/wasm }
      # The third-party notices in the bundle list the Rust crates of the STEP reader and the desktop app.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - run: echo "VITE_RELEASE=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      # The cloud configuration is baked into public assets, so it is checked before the build and in the built files
      # before anything is uploaded.
      - run: node scripts/check-cloud-config.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_FR_REGION: ${{ vars.VITE_FR_REGION }}
          VITE_POSTHOG_TOKEN: ${{ vars.VITE_POSTHOG_TOKEN }}
          VITE_COMMONS_ASSETS_URL: ${{ github.ref_name != 'staging' && vars.VITE_COMMONS_ASSETS_URL || vars.STAGING_COMMONS_ASSETS_URL }}
      - run: test -s apps/web/dist/third-party-notices.txt
      - run: node scripts/check-cloud-config.mjs apps/web/dist
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Source maps go to Sentry (needs the secret SENTRY_AUTH_TOKEN) and are kept as an
      # artifact of this deploy, then removed from the upload.
      - run: node scripts/sentry-sourcemaps.mjs apps/web/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: sourcemaps-web-${{ github.sha }}
          path: apps/web/dist/**/*.map
          if-no-files-found: error
          retention-days: 90
      - run: find apps/web/dist -name '*.map' -delete
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name pushform-app --branch ${{ github.ref_name }} --commit-hash ${{ github.sha }} --commit-dirty=false
      - name: Verify the published app after edge propagation
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-deploy.mjs "$DEPLOY_ORIGIN" --strict; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              echo "::notice::Deployment verification has not passed yet; retrying in 10 seconds ($attempt/6)."
              sleep 10
            fi
          done
          exit 1
        env:
          DEPLOY_ORIGIN: ${{ github.ref_name == 'staging' && 'https://staging.pushform-app.pages.dev' || 'https://pushform-app.pages.dev' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
