[package]
name = "pushform"
version = "0.1.0"
description = "PushForm desktop app"
authors = ["PushForm"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pushform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# The STEP reader, run natively here (the web app runs the same crate as WebAssembly).
pushform-step-reader = { path = "../../../crates/step-reader" }

[dependencies.clipboard-rs]
version = "0.3.5"
default-features = false

# Cargo applies patches only from the root manifest of a build, so the STEP reader's patched truck crates
# (SolidCraft's fixes, pinned with the reader in crates/step-reader/Cargo.toml) are repeated here.
[patch.crates-io]
truck-geometry = { path = "../../../crates/solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "../../../crates/solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "../../../crates/solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "../../../crates/solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "../../../crates/solidcraft/vendor/matext4cgmath" }
