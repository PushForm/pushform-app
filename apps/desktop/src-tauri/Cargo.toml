[package]
name = "pushform"
version = "0.1.0"
description = "PushForm desktop app"
authors = ["PushForm"]
license = "GPL-3.0-or-later"
repository = ""
publish = false
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Off by default: see the pushform-native-kernel dependency below.
native-kernel = ["dep:pushform-native-kernel"]

[lib]
name = "pushform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# The STEP reader, run natively here (the web app runs the same crate as WebAssembly).
pushform-step-reader = { path = "../../../crates/step-reader" }

# The native Rust kernel (crates/native-kernel). Building it compiles Manifold, Clipper2 and oneTBB from source with
# cmake, so it is off by default; turn it on with `--features native-kernel` together with PF_NATIVE_KERNEL=1 for the web
# bundle (see the root `desktop:native` script).
pushform-native-kernel = { path = "../../../crates/native-kernel", optional = true }

[dependencies.clipboard-rs]
version = "0.3.5"
default-features = false

# Cargo applies patches only from the root manifest of a build, so the STEP reader's patched truck crates
# (SolidCraft's fixes, pinned with the reader in crates/step-reader/Cargo.toml) are repeated here.
[patch.crates-io]
truck-geometry = { path = "../../../crates/solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "../../../crates/solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "../../../crates/solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "../../../crates/solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "../../../crates/solidcraft/vendor/matext4cgmath" }
