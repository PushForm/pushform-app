[package]
name = "pushform-step-reader"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "PushForm's STEP reader: SolidCraft's STEP import and tessellation behind a small C ABI, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SolidCraft's B-rep kernel and its STEP reader (MIT OR Apache-2.0), carried in this repository under
# crates/solidcraft and adapted there (see its README). The kernel builds on patched copies of the truck
# crates that live beside it (see [patch] below).
solidcraft-kernel = { path = "../solidcraft/kernel", default-features = false }
earcutr = "0.5"
solidcraft-geom = { path = "../solidcraft/geom" }

# Natively the kernel always has its worker threads; in WebAssembly only the `threads` build does.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcraft-kernel = { path = "../solidcraft/kernel", features = ["threads"] }

[patch.crates-io]
truck-geometry = { path = "../solidcraft/vendor/truck-geometry" }
truck-shapeops = { path = "../solidcraft/vendor/truck-shapeops" }
truck-stepio = { path = "../solidcraft/vendor/truck-stepio" }
truck-meshalgo = { path = "../solidcraft/vendor/truck-meshalgo" }
matext4cgmath = { path = "../solidcraft/vendor/matext4cgmath" }

[features]
default = ["simplify"]
# Re-triangulate flat faces from their outlines (off for comparing against the kernel's own meshes).
simplify = []
# Mesh on threads in WebAssembly: build with `--target wasm32-wasip1-threads --features threads` (the single-threaded
# module leaves it off and the host meshes one part per call).
threads = ["solidcraft-kernel/threads"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
# Panics unwind through the C ABI as traps either way; abort keeps the module smaller.
panic = "abort"
