syntax = "proto2";
package pushform.native;
message CatalogRecord {
  required uint32 kind = 1; // 1 material, 2 tag, 3 tag folder, 4 style, 5 scene, 6 image asset
  required uint32 schema_major = 2;
  required bool required = 3;
  required bytes payload = 4; // Protobuf message selected by kind/schema_major
}
