syntax = "proto2";
package pushform.native;
// DRAFT. Header, model targets and viewport mappings are separate archive-owned records.
message LayoutArchive {
  required string id = 1;
  required uint32 asset_id = 2;
  required uint32 format = 3; // 0 sketchup-layout
  required uint32 model_count = 4;
  required uint32 viewport_count = 5;
  optional uint32 annotation_connections_version = 6; // 0 undefined, 1 version 1
}
message LayoutArchiveModel {
  required string id = 1;
  optional string internal_target = 2; // absent means null
  optional string external_target = 3;
}
message LayoutArchiveViewport {
  required string id = 1;
  optional string model_reference_id = 2; // absent means null
  required uint32 entity_count = 3;
  repeated uint32 entity_chunks = 4 [packed = true]; // streamed Uint32 IDs
}
