syntax = "proto2";
package pushform.native;
// DRAFT. Payloads and streamed geometry are owned by this stable entity ID.
message LayoutEntityOptionalString { required uint32 state = 1; optional string value = 2; }
message LayoutEntityOptionalBytes { required uint32 state = 1; optional bytes value = 2; }
message LayoutEntityStyle {
  required bytes base = 1; // LayoutDefaultStyle
  optional LayoutEntityOptionalBytes stroke_dash_mm = 2; // Float64 sequence
  optional LayoutEntityOptionalBytes fill_pattern = 3; // LayoutFillPattern
}
message LayoutFillPattern {
  required uint32 asset_id = 1; // image asset of the tiled picture
  required double tile_width_mm = 2;
  required double tile_height_mm = 3;
  required double origin_x_mm = 4;
  required double origin_y_mm = 5;
  required double scale = 6;
  required double rotation_deg = 7;
}
message LayoutEntityMetadata {
  required uint32 id = 1;
  required uint32 kind = 2; // path, text, label, dimension, angular-dimension, image, table
  required uint32 layer_id = 3;
  optional LayoutEntityOptionalString name = 4;
  optional uint32 locked = 5; // 0 undefined, 1 false, 2 true
  optional uint32 hidden = 6;
  optional uint32 group_id = 7; // 0 explicit undefined
  optional LayoutEntityOptionalBytes nested_group_ids = 8; // packed uint32
  optional LayoutEntityOptionalBytes style = 9; // LayoutEntityStyle
}
