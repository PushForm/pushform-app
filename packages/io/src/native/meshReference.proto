syntax = "proto2";
package pushform.native;
message MeshReference {
  required uint32 vertex_count = 1;
  required uint32 triangle_count = 2;
  repeated uint32 vertex_chunks = 3 [packed = true]; // Float64 xyz
  repeated uint32 triangle_chunks = 4 [packed = true]; // Uint32 vertex indices
  repeated uint32 face_id_chunks = 5 [packed = true]; // Uint32 per triangle
}
