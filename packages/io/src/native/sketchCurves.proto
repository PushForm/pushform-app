syntax = "proto2";
package pushform.native;
message SketchCurves {
  required uint32 count = 1;
  required uint32 reference_count = 2;
  repeated uint32 ids = 3 [packed=true]; // Uint32 curve IDs
  repeated uint32 kinds = 4 [packed=true]; // Uint8: 0 arc, 1 circle, 2 polygon, 3 freehand
  repeated uint32 geometry = 5 [packed=true]; // Float64 center.xyz, normal.xyz, radius, startAngle, endAngle
  repeated uint32 segments = 6 [packed=true]; // Uint32 segment counts
  repeated uint32 offsets = 7 [packed=true]; // Uint32 count+1 offsets into edge references
  repeated uint32 edge_ids = 8 [packed=true]; // Uint32 sketch edge IDs, source order
  // Repeated fields contain storage chunk IDs. Body EdgeKey strings use a separate owner schema.
}
