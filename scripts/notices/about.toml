# cargo-about configuration for the Rust crates PushForm ships: the STEP reader (crates/step-reader, WebAssembly in the
# web app and native in the desktop app) and the desktop app (apps/desktop/src-tauri). scripts/third-party-notices.mjs
# runs `cargo about generate --format json` with it for each workspace and writes their license texts into the
# third-party notices.
#
# Every accepted license is GPLv3-compatible and also listed in ALLOWED in scripts/license-check.mjs (its tests check
# that). Where a crate offers a choice, the earlier license in this list is the one recorded.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "OFL-1.1",
]

# PushForm's own crates, and the SolidCraft kernel crates carried in crates/solidcraft (publish = false), are not
# listed as dependencies; the kernel's notices are included verbatim instead.
private = { ignore = true }
ignore-dev-dependencies = true

# Recovers license files that the published crates leave out.
workarounds = ["chrono", "ring", "rustls"]
